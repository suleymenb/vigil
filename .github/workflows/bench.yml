name: bench

# Manual: how much CPU does this commit use on a Linux server compared with
# an earlier one? Linux is where vigil is meant to run, and it can't be
# measured on the Mac it is written on.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Tag or commit to compare against
        default: v0.7.0
      threads:
        description: Threads in the stand-in for a busy server process
        default: "4000"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      BASE: ${{ inputs.base }}
      THREADS: ${{ inputs.threads }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust and strace
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update && sudo apt-get install -y strace lsof
      - name: Build both
        run: |
          cargo build --release --locked
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base" && cargo build --release --locked
      - name: Whole program under a server-like load
        run: scripts/bench-linux.sh "$RUNNER_TEMP/base/target/release/vigil" "$PWD/target/release/vigil" "$THREADS" 30
      - name: Per-tick cost, this commit
        run: cargo test --release --locked bench_ -- --ignored --nocapture 2>&1 | grep -E "ms/|µs/|test result"
      - name: Per-tick cost, base
        run: cd "$RUNNER_TEMP/base" && cargo test --release --locked bench_ -- --ignored --nocapture 2>&1 | grep -E "ms/|µs/|test result"
