name: release

# Triggered by pushing a v* tag (or by `gh release create vX.Y.Z`).
# Builds static Linux binaries (musl), macOS and Windows binaries, runs the
# test suite on every native target, then builds .deb / .rpm packages, shell
# completions and the man page, and attaches everything with SHA-256 sums.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, test: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, test: true }
          - { target: aarch64-apple-darwin, os: macos-latest, test: true }
          - { target: x86_64-apple-darwin, os: macos-latest, test: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, test: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, test: false }
          # Windows 7 / 8.1 (experimental, untested): tier-3 target on nightly.
          - { target: x86_64-win7-windows-msvc, os: windows-latest, test: false, nightly: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.nightly == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          if [ "${{ matrix.nightly }}" = "true" ]; then
            rustup toolchain install nightly --profile minimal --component rust-src
            rustup default nightly
          else
            rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
            rustup default stable
          fi

      - name: Install musl tools and lsof
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools lsof

      - name: Test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.nightly }}" = "true" ]; then
            cargo build --release --locked -Z build-std=std,panic_abort --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          # Stable names (no version) so releases/latest/download/... always works.
          name="vigil-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/vigil.exe" "$name/"
            7z a -tzip "$name.zip" "$name" >/dev/null
            sum "$name.zip" > "$name.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/vigil" "$name/"
            tar czf "$name.tar.gz" "$name"
            sum "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Keep Linux binaries for the packages job
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vigil

      - name: Ensure release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "vigil $GITHUB_REF_NAME" --generate-notes || true

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" vigil-${{ matrix.target }}.* --clobber

  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
      - name: Install rpm
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Completions and man page
        run: |
          chmod +x bin-*/vigil
          v=bin-x86_64-unknown-linux-musl/vigil
          mkdir -p extra/completions
          $v completions bash > extra/completions/vigil.bash
          $v completions zsh > extra/completions/_vigil
          $v completions fish > extra/completions/vigil.fish
          $v completions powershell > extra/completions/_vigil.ps1
          $v completions elvish > extra/completions/vigil.elv
          $v man > extra/vigil.1
          gzip -9n -c extra/vigil.1 > extra/vigil.1.gz
          tar czf vigil-completions-and-man.tar.gz -C extra .
      - name: .deb and .rpm
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pair in "x86_64-unknown-linux-musl amd64 x86_64" "aarch64-unknown-linux-musl arm64 aarch64"; do
            set -- $pair
            target=$1 deb_arch=$2 rpm_arch=$3
            root="pkg-$deb_arch"
            install -Dm755 "bin-$target/vigil" "$root/usr/bin/vigil"
            install -Dm644 extra/vigil.1.gz "$root/usr/share/man/man1/vigil.1.gz"
            install -Dm644 extra/completions/vigil.bash "$root/usr/share/bash-completion/completions/vigil"
            install -Dm644 extra/completions/_vigil "$root/usr/share/zsh/vendor-completions/_vigil"
            install -Dm644 extra/completions/vigil.fish "$root/usr/share/fish/vendor_completions.d/vigil.fish"
            install -Dm644 README.md "$root/usr/share/doc/vigil/README.md"
            install -Dm644 LICENSE "$root/usr/share/doc/vigil/copyright"

            mkdir -p "$root/DEBIAN"
            cat > "$root/DEBIAN/control" <<EOF
          Package: vigil
          Version: $version
          Architecture: $deb_arch
          Maintainer: suleymenb <suleymenb@users.noreply.github.com>
          Section: admin
          Priority: optional
          Homepage: https://github.com/suleymenb/vigil
          Recommends: lsof, tcpdump, mtr-tiny, lldpd
          Description: terminal monitor and troubleshooter for DevOps and network engineers
           Processes, sockets with lsof, network, routes, probes, firewall counters,
           containers, services, kernel events and a layer-by-layer network doctor.
          EOF
            dpkg-deb --build --root-owner-group "$root" "vigil-$deb_arch.deb"

            mkdir -p rpmbuild/SOURCES
            cat > vigil.spec <<EOF
          %global debug_package %{nil}
          %global __os_install_post %{nil}
          Name: vigil
          Version: $version
          Release: 1
          Summary: Terminal monitor and troubleshooter for DevOps and network engineers
          License: MIT
          URL: https://github.com/suleymenb/vigil
          Recommends: lsof
          %description
          Processes, sockets with lsof, network, routes, probes, firewall counters,
          containers, services, kernel events and a layer-by-layer network doctor.
          %install
          mkdir -p %{buildroot}
          cp -a $PWD/$root/usr %{buildroot}/
          rm -rf %{buildroot}/usr/share/doc
          %files
          /usr/bin/vigil
          /usr/share/man/man1/vigil.1.gz
          /usr/share/bash-completion/completions/vigil
          /usr/share/zsh/vendor-completions/_vigil
          /usr/share/fish/vendor_completions.d/vigil.fish
          %license $PWD/LICENSE
          %doc $PWD/README.md
          EOF
            rpmbuild -bb --target "$rpm_arch" --define "_topdir $PWD/rpmbuild" vigil.spec
            cp rpmbuild/RPMS/$rpm_arch/vigil-*.rpm "vigil-$rpm_arch.rpm"
          done
          for f in vigil-*.deb vigil-*.rpm vigil-completions-and-man.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          ls -l vigil-*
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" vigil-*.deb vigil-*.rpm vigil-completions-and-man.tar.gz *.sha256 --clobber
