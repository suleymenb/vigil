name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install lsof
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Windows 7 / 8.1: Rust stable needs Windows 10+, so these builds use the
  # tier-3 win7 target (nightly + build-std). Built, never run in CI.
  windows7:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        shell: bash
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Build x86_64-win7-windows-msvc
        run: cargo +nightly build --release --locked -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc
