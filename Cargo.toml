[package]
name = "vigil"
version = "0.4.0"
edition = "2021"
description = "A modern terminal system monitor for DevOps, networking and Linux administration"
license = "MIT"

[dependencies]
ratatui = "=0.29.0"
crossterm = "0.28"
sysinfo = { version = "=0.33.1", default-features = false, features = ["system", "disk", "network", "component", "user"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
