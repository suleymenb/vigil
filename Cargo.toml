[package]
name = "vigil"
version = "0.6.0"
edition = "2021"
description = "Terminal monitor and network troubleshooter: processes, sockets with lsof, routes, probes, firewall, containers, and a layer-by-layer network doctor"
license = "MIT"
repository = "https://github.com/suleymenb/vigil"
readme = "README.md"
keywords = ["monitoring", "tui", "lsof", "network", "troubleshooting"]
categories = ["command-line-utilities", "network-programming", "visualization"]
# Only what the build needs; screenshots, docs and CI stay on GitHub.
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

# The command is always `vigil`, whatever the package is called on crates.io.
[[bin]]
name = "vigil"
path = "src/main.rs"

[dependencies]
ratatui = "=0.29.0"
crossterm = "0.28"
sysinfo = { version = "=0.33.1", default-features = false, features = ["system", "disk", "network", "component", "user"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
libc = "0.2"
clap_complete = "4"
clap_mangen = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
