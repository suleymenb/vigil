<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vigil Field Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: course app. Sticky lesson rail on the left (top selector on phones), one lesson at a time on the right,
   terminal plates in vigil's own tokyo-night palette, interactive quiz / key trainer / drills / exam. */
:root {
  --bg: #f3f4f9; --surface: #ffffff; --raised: #eceef7; --fg: #1d2135; --muted: #596083; --line: #d8dbe9;
  --accent: #3d59a1; --accent-2: #7847bd; --ok: #2f7d32; --warn: #a8660a; --bad: #b3263e;
  --t-bg: #1a1b26; --t-fg: #c0caf5; --t-dim: #565f89; --t-muted: #7a84b2; --t-border: #3b4261; --t-sel: #292e42;
  --t-blue: #7aa2f7; --t-purple: #bb9af7; --t-cyan: #7dcfff; --t-teal: #73daca; --t-green: #9ece6a; --t-yellow: #e0af68; --t-orange: #ff9e64; --t-red: #f7768e;
  --f-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12131b; --surface: #1a1b26; --raised: #20222f; --fg: #c8cfee; --muted: #8b93bb; --line: #2c3047;
  --accent: #7aa2f7; --accent-2: #bb9af7; --ok: #9ece6a; --warn: #e0af68; --bad: #f7768e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12131b; --surface: #1a1b26; --raised: #20222f; --fg: #c8cfee; --muted: #8b93bb; --line: #2c3047;
  --accent: #7aa2f7; --accent-2: #bb9af7; --ok: #9ece6a; --warn: #e0af68; --bad: #f7768e; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.65 var(--f-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: -0.02em; }
h2 { font-size: 1.45rem; margin-top: 34px; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
a { color: var(--accent); }
code, kbd, .mono { font-family: var(--f-mono); font-size: 0.86em; }
code { background: var(--raised); padding: 1px 6px; border-radius: 4px; }
kbd { display: inline-block; min-width: 1.75em; text-align: center; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); font-weight: 600; white-space: nowrap; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 36px; padding-top: 28px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand .mark { font: 700 1.25rem var(--f-mono); color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
.progress { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .group { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-2); margin: 12px 0 4px; }
.nav a { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14.5px; }
.nav a:hover { background: var(--raised); }
.nav a[aria-current="page"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.nav .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 10px; color: var(--surface); }
.nav .dot.done { background: var(--ok); border-color: var(--ok); }
.nav .min { font: 12px var(--f-mono); color: var(--muted); }
.mobile-nav { display: none; }

main { min-width: 0; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }
.eyebrow { font: 600 12px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); }
.lead { font-size: 1.1rem; color: var(--muted); max-width: 68ch; }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 72ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.goals { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; max-width: 72ch; }
.goals h3 { font-size: 13px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.goals ul { margin: 0; padding-left: 1.2em; }
.note { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent-2); border-radius: 6px; padding: 10px 14px; font-size: 15px; max-width: 72ch; }
.tip { border-left-color: var(--ok); }
.warn { border-left-color: var(--warn); }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td:first-child { white-space: nowrap; }

.term-wrap { overflow-x: auto; border-radius: 10px; box-shadow: 0 14px 40px -22px rgba(20, 22, 40, .55); }
.term { min-width: 720px; background: var(--t-bg); color: var(--t-fg); font: 12.5px/1.45 var(--f-mono); padding: 12px 14px; border-radius: 10px; }
.term pre { margin: 0; font: inherit; white-space: pre; }
.b { color: var(--t-blue); } .p { color: var(--t-purple); } .c { color: var(--t-cyan); } .te { color: var(--t-teal); }
.g { color: var(--t-green); } .y { color: var(--t-yellow); } .o { color: var(--t-orange); } .r { color: var(--t-red); }
.d { color: var(--t-dim); } .m { color: var(--t-muted); } .bd { color: var(--t-border); } .w { color: var(--t-fg); font-weight: 700; }
.badge { background: var(--t-blue); color: var(--t-bg); font-weight: 700; }
.chip-r { background: var(--t-red); color: var(--t-bg); font-weight: 700; } .chip-o { background: var(--t-orange); color: var(--t-bg); font-weight: 700; }
.sel { background: var(--t-sel); }
.callout { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.callout div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; min-width: 0; }
.callout b { display: block; font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); margin-bottom: 2px; }

.try { background: var(--surface); border: 1px dashed var(--accent); border-radius: 10px; padding: 14px 18px; max-width: 72ch; display: flex; flex-direction: column; gap: 8px; }
.try h3 { font-size: 14px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.try label { display: flex; gap: 10px; align-items: baseline; font-size: 15px; cursor: pointer; }
.try input { accent-color: var(--accent); }

.quiz { display: flex; flex-direction: column; gap: 14px; max-width: 76ch; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.q .opts { display: flex; flex-direction: column; gap: 6px; }
.q button.opt { text-align: left; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; font-size: 15px; }
.q button.opt:hover:not(:disabled) { border-color: var(--accent); }
.q button.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
.q button.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.q button.opt:disabled { cursor: default; }
.q .why { font-size: 14.5px; color: var(--muted); }
.result { font-weight: 600; }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; max-width: 76ch; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 9px 16px; font-weight: 600; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:hover { filter: brightness(1.05); }

.trainer { background: var(--t-bg); color: var(--t-fg); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; max-width: 76ch; font-family: var(--f-mono); }
.trainer .ctx { color: var(--t-purple); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.trainer .task { font: 600 1.35rem var(--f-display); color: var(--t-fg); min-height: 2.2em; }
.trainer .fb { min-height: 1.6em; font-size: 15px; }
.trainer .stats { display: flex; gap: 22px; flex-wrap: wrap; color: var(--t-muted); font-size: 13px; }
.trainer .stats b { color: var(--t-fg); font-size: 18px; display: block; }
.trainer button { background: var(--t-blue); color: var(--t-bg); border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; align-self: flex-start; }
.trainer .keys-hint { color: var(--t-dim); font-size: 12.5px; }

.cheat { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px 28px; }
.cheat h3 { font-size: 13px; font-family: var(--f-mono); color: var(--accent-2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.cheat dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: 14px; }
.cheat dd { margin: 0; color: var(--muted); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; gap: 14px; padding-top: 16px; }
  .rail { position: static; max-height: none; }
  .nav { display: none; }
  .mobile-nav { display: block; }
  .mobile-nav select { width: 100%; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="rail" aria-label="Course navigation">
    <div class="brand"><span class="mark">◆ vigil</span><strong>Field Course</strong><small>From first launch to incident drills. Covers v0.6.</small></div>
    <div class="progress"><span id="progress-label">0 of 0 lessons done</span><div class="bar"><i id="progress-bar" style="width:0"></i></div></div>
    <div class="mobile-nav"><label for="mobile-select" class="eyebrow">Jump to</label><select id="mobile-select"></select></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

function term(key) { return '<div class="term-wrap"><div class="term"><pre>' + T[key] + '</pre></div></div>'; }
function keys(rows) {
  return '<div class="tbl"><table><thead><tr><th>Key</th><th>What it does</th></tr></thead><tbody>' +
    rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table></div>';

  return '<div class="try"><h3>Try it on your machine</h3>' + items.map(function (t, i) {
    return '<label><input type="checkbox" data-try="' + i + '"> <span>' + t + '</span></label>';

// ───────────────────────────── lessons ─────────────────────────────
var L = [];
function lesson(o) { L.push(o); }

lesson({ id: 'welcome', group: 'Start', title: 'Welcome & how vigil works', min: 6,
  goals: ['Know what vigil shows and where', 'Install and start it correctly', 'Read the screen: header, tabs, badges, footer'],
  body:
  '<div class="prose"><p>vigil is a terminal monitor for servers and networks. It puts the things you normally check with ten different tools (<code>top</code>, <code>ss</code>, <code>lsof</code>, <code>ip</code>, <code>ping</code>, <code>iostat</code>, <code>dmesg</code>, <code>journalctl</code>, <code>docker stats</code>, <code>w</code>) on one keyboard-driven screen.</p>' +
  '<p>Under the hood, background threads collect data and the screen only redraws when something changes. Heavy collectors (routes, firewall, containers, services) run fast only while you look at them. That is why vigil can stay open all day at around 2.5 % of one core.</p></div>' +
  '<h2>Install and start</h2>' +
  '<div class="prose"><p>One line installs the right binary for your OS and CPU, verifies its checksum and puts it in <code>/usr/local/bin</code>:</p>' +
  '<p><code>curl -fsSL https://raw.githubusercontent.com/suleymenb/vigil/master/install.sh | sh</code></p>' +
  '<p>Then start it with <code>sudo vigil</code>. Root is optional, but without it you only see your own processes in lsof, sockets and firewall counters, and kernel events stay hidden.</p></div>' +
  '<div class="note warn"><b>Common trap:</b> <code>sudo vigil</code> says "command not found" when vigil lives in <code>~/.cargo/bin</code>, because sudo does not search there. Use the install script, or run <code>sudo "$(which vigil)"</code>.</div>' +
  '<h2>Anatomy of the screen</h2>' + term('anatomy') +
  '<div class="callout"><div><b>Header</b>Host, OS, uptime, load (coloured per core), process count, live or paused, refresh interval, and whether you are root.</div>' +
  '<div><b>Tab row</b>Twelve views with their key. On the right: <b>health badges</b>, or <span class="mono">✓ healthy</span> when nothing is wrong.</div>' +
  '<div><b>Middle</b>The view you picked. Tables, graphs and detail panes.</div>' +
  '<div><b>Footer</b>The keys that work in this view right now, or a status message after an action.</div></div>' +
  tryit(['Run <code>vigil --version</code> and check it says 0.5.0 or newer.', 'Start <code>sudo vigil</code> and find the root badge in the header.', 'Read the footer: which keys does the Overview offer?']),
  quiz: [
    { q: 'Why does vigil stay light while it shows so much?', o: ['It samples only once a minute', 'Collectors run on background threads, heavy ones only while their view is open, and the screen redraws only on change', 'It uses a GPU', 'It skips processes it considers idle'], a: 1, why: 'Background threads plus redraw-on-change keep the UI thread nearly idle. Routes, firewall, containers and services poll fast only when you look at them.' },
    { q: '<code>sudo vigil</code> says command not found. What is the likely cause?', o: ['vigil needs a license', 'The binary is in ~/.cargo/bin, which sudo does not search', 'The terminal lacks truecolor', 'lsof is missing'], a: 1, why: 'sudo uses a restricted PATH. Install to /usr/local/bin or run <code>sudo "$(which vigil)"</code>.' },
    { q: 'Where do problems show up regardless of the view you are in?', o: ['In the footer', 'As health badges on the right of the tab row', 'Only in the Overview', 'In a popup'], a: 1, why: 'Health badges are drawn on every view, so you never miss a crossed threshold.' }
  ] });

lesson({ id: 'navigation', group: 'Start', title: 'Moving around', min: 7,
  goals: ['Switch views by key and by mouse', 'Filter, pause, change speed and theme', 'Copy and export what you see'],
  body:
  '<div class="prose"><p>Everything in vigil is one key away. Capital letters matter: <kbd>T</kbd> (shift+t) opens the theme picker, while lowercase <kbd>t</kbd> toggles the process tree.</p></div>' +
  keys([
    [k('1') + '…' + k('9') + ' ' + k('0') + ' ' + k('S') + ' ' + k('U'), 'Jump to a view: 1 Overview, 2 Procs, 3 Network, 4 Sockets, 5 Files, 6 Storage, 7 Routes, 8 Probes, 9 Firewall, 0 Containers, S System, U Users'],
    [k('Tab') + ' ' + k('←') + ' ' + k('→'), 'Next / previous view'],
    [k('↑') + ' ' + k('↓') + ' ' + k('j') + ' ' + k('k'), 'Move the selection (the mouse wheel works too)'],
    [k('PgUp') + ' ' + k('PgDn') + ' ' + k('g') + ' ' + k('G'), 'Page up / down, jump to top / bottom'],
    [k('/'), 'Filter the current list; ' + k('Esc') + ' clears it'],
    [k('space'), 'Pause sampling (freeze the screen to read it)'],
    [k('+') + ' ' + k('-'), 'Refresh interval ±250 ms'],
    [k('T'), 'Theme picker: ↑↓ to preview, Enter to keep, Esc to cancel, b for transparent background'],
    [k('N'), 'Reverse DNS on/off: host names instead of IPs'],
    [k('y'), 'Copy the selected value to your clipboard (works over SSH)'],
    [k('E'), 'Export the current table to a CSV file'],
    [k('?'), 'Help with every key'],
    [k('q'), 'Quit (settings such as theme and sort order are saved)']
  ]) +
  '<h2>The mouse</h2><div class="prose"><p>Click a tab to switch views, click a row to select it, click a column header in Procs to sort by it, and scroll with the wheel.</p></div>' +
  '<div class="note tip"><b>Copy over SSH:</b> <kbd>y</kbd> uses the terminal clipboard escape (OSC 52). In tmux add <code>set -g set-clipboard on</code>; in iTerm2 allow apps to access the clipboard.</div>' +
  tryit(['Press 4 then 2 to hop between Sockets and Procs.', 'Press / in Procs, type <code>ssh</code>, then Esc.', 'Press T, browse with ↑↓, keep a theme with Enter.', 'Select a process and press y; paste somewhere.']),
  quiz: [
    { q: 'Which key opens the theme picker?', o: ['t', 'T (shift+t)', 'F2', 'ctrl+t'], a: 1, why: 'Lowercase t toggles the process tree in Procs; capital T opens the theme picker everywhere.' },
    { q: 'You want to read a busy table without numbers jumping. What do you press?', o: ['q', 'space', 'Esc', 'p'], a: 1, why: 'Space pauses sampling; press it again to resume.' },
    { q: 'Which key jumps to the Users view?', o: ['u', 'U', '0', '9'], a: 1, why: 'Views beyond 9 use 0 (Containers), S (System) and U (Users).' }
  ] });

lesson({ id: 'overview', group: 'Reading the system', title: 'Overview & health badges', min: 8,
  goals: ['Read every panel of the Overview', 'Know what each badge means and what to do about it'],
  body:
  '<div class="prose"><p>The Overview answers "is something wrong, and where?" in one look: CPU graph and per-core meters, memory, network rx/tx, top processes, listening ports, TCP states and disks.</p>' +
  '<p>Badges appear on the right of the tab row when a threshold is crossed. Red is urgent, orange needs attention, yellow is informational. You set every threshold in the <code>[alerts]</code> section of the config; <code>0</code> turns a check off.</p></div>' +
  '<div class="tbl"><table><thead><tr><th>Badge</th><th>What it means</th><th>First move</th></tr></thead><tbody>' +
  [['MEM / SWAP', 'Memory pressure', 'Procs, sort with m'],
   ['DISK &lt;mount&gt;', 'Filesystem nearly full', 'Storage; if du disagrees, <code>:+L1</code>'],
   ['INODES &lt;mount&gt;', 'Out of inodes, even with free space', 'Find directories with millions of small files'],
   ['LOAD', 'More runnable tasks than CPUs', 'Procs sorted by CPU; check PSI and disk latency'],
   ['&lt;dev&gt; AWAIT / BUSY', 'Slow or saturated disk', 'Storage, devices table'],
   ['FDS / FILES', 'Process near its fd limit / system file table full', 'Procs, sort with e, then Enter'],
   ['EPHEMERAL PORTS', 'Outgoing ports running out', 'Sockets: TIME_WAIT and pooling'],
   ['RETRANS', 'Packet loss on some path', 'Sockets sorted by rtt; Probes'],
   ['LISTEN DROPS', 'Accept queue overflowing', 'Sockets, l, look at RECV Q'],
   ['UDP DROPS', 'UDP buffers full', 'Raise buffers or speed up the consumer'],
   ['CONNTRACK', 'Connection-tracking table nearly full', 'Raise nf_conntrack_max'],
   ['CLOSE_WAIT / TIME_WAIT', 'App not closing sockets / too many short connections', 'Sockets, filter the state'],
   ['THROTTLED / OOM', 'Container hits its CPU quota / something was OOM-killed', 'Containers (0), System kernel events'],
   ['FAILED UNITS', 'systemd units failed', 'System (S), journal'],
   ['NEEDS RESTART', 'Processes running replaced binaries/libraries', 'Inspector shows which unit'],
   ['SSH FAILS', 'Many failed SSH logins in the last hour', 'Users (U)'],
   ['CERT / HTTP / LOSS', 'Certificate expiring / site error / probe loss', 'Probes (8)'],
   ['PSI', 'Linux pressure stall on cpu, memory or io', 'The named resource is the bottleneck']
  ].map(function (r) { return '<tr><td class="mono">' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') +
  '</tbody></table></div>' +
  tryit(['Find the "✓ healthy" text, or note which badges your system shows.', 'Open the config at <code>~/.config/vigil/config.toml</code> and find the <code>[alerts]</code> section.']),
  quiz: [
    { q: '<code>df</code> shows free space, but writes fail with "No space left on device". Which badge would you look for?', o: ['DISK', 'INODES', 'MEM', 'LOAD'], a: 1, why: 'Every file needs an inode; when they run out, no file can be created whatever the free space.' },
    { q: 'How do you turn a single badge check off?', o: ['Delete the badge with D', 'Set its threshold to 0 in [alerts]', 'Run with --quiet', 'You cannot'], a: 1, why: 'In the [alerts] section, 0 disables a numeric check (and false the boolean ones).' },
    { q: 'What does LISTEN DROPS tell you?', o: ['The firewall drops packets', 'A listening socket’s accept queue overflowed, so new connections were silently dropped', 'The NIC lost link', 'DNS failed'], a: 1, why: 'The service accepts too slowly; raise its backlog or add workers.' }
  ] });

lesson({ id: 'processes', group: 'Reading the system', title: 'Processes', min: 9,
  goals: ['Read every column', 'Sort, filter and see the tree', 'Send the right signal'],
  body: term('procs') +
  '<div class="callout">' +
  [['CPU%', 'Share of one core; above 100 means several cores.'], ['MEM / MEM%', 'Resident memory and share of RAM.'], ['IO R/W', 'Disk bytes read/written per second.'],
   ['CONN', 'Open sockets of the process.'], ['NET/s', 'Network bandwidth (Linux, from TCP counters).'], ['FDS', 'Open file descriptors; turns orange at 70 % and red at 90 % of the limit.'],
   ['ST', 'R running, S sleeping, I idle, D disk wait, T stopped, Z zombie.'], ['TIME', 'How long it has been running.']].map(function (c) { return '<div><b>' + c[0] + '</b>' + c[1] + '</div>'; }).join('') + '</div>' +
  keys([
    [k('c') + ' ' + k('m') + ' ' + k('p') + ' ' + k('n'), 'Sort by CPU, memory, PID, name (press again to reverse)'],
    [k('u') + ' ' + k('i') + ' ' + k('o') + ' ' + k('w') + ' ' + k('e'), 'Sort by user, disk IO, connections, network, open fds'],
    [k('r'), 'Reverse the sort'], [k('t'), 'Process tree (parents and children)'],
    [k('↵'), 'Open the inspector for this process'], [k('f'), 'All open files (lsof -p)'],
    [k('x') + ' ' + k('K') + ' ' + k('Del'), 'Send a signal']
  ]) +
  '<h2>Which signal when</h2><div class="tbl"><table><thead><tr><th>Signal</th><th>Use it for</th></tr></thead><tbody>' +
  '<tr><td class="mono">TERM</td><td>Ask the process to stop cleanly. Always try this first.</td></tr>' +
  '<tr><td class="mono">HUP</td><td>Reload configuration (nginx, haproxy, many daemons). Send it to the master, the top of the tree.</td></tr>' +
  '<tr><td class="mono">INT / QUIT</td><td>Interrupt like Ctrl-C / quit with a core dump.</td></tr>' +
  '<tr><td class="mono">STOP / CONT</td><td>Pause a runaway process and resume it later.</td></tr>' +
  '<tr><td class="mono">KILL</td><td>Last resort: cannot be caught, nothing gets flushed.</td></tr>' +
  '</tbody></table></div><div class="prose"><p>In the dialog: ↑↓ or 1–9 to pick, Enter to send, Esc to cancel.</p></div>' +
  tryit(['Press 2, then m to sort by memory, then m again to reverse.', 'Press t and find your shell in the tree.', 'Press e to see who holds the most file descriptors.']),
  quiz: [
    { q: 'A zombie (Z) keeps showing up. Who do you signal?', o: ['The zombie, with KILL', 'Its parent', 'init', 'Nobody, reboot'], a: 1, why: 'A zombie is already dead and ignores signals. It disappears when the parent collects it or exits.' },
    { q: 'You changed nginx.conf. What do you send, and to which process?', o: ['KILL to every worker', 'HUP to the master process', 'TERM to the master', 'STOP then CONT'], a: 1, why: 'HUP to the master reloads the config without dropping connections.' },
    { q: 'Which key sorts by open file descriptors?', o: ['f', 'd', 'e', 'o'], a: 2, why: 'e sorts by fds; f opens the lsof list; o sorts by connections.' }
  ] });

lesson({ id: 'inspector', group: 'Reading the system', title: 'The process inspector', min: 7,
  goals: ['Open the inspector from Procs or Sockets', 'Use history graphs to spot leaks', 'Read environment, journal and restart state'],
  body:
  '<div class="prose"><p>Press <kbd>↵</kbd> on a process (or <kbd>i</kbd> on a socket) to see everything about it on one screen.</p></div>' + term('inspector') +
  '<div class="callout"><div><b>Identity</b>pid, user, status, exe, working directory, root, command, parents, children, systemd unit, container, cgroup.</div>' +
  '<div><b>Restart</b>Shown in orange when the process still runs a binary or library that was replaced by an update.</div>' +
  '<div><b>Resources</b>Two-minute graphs of CPU, memory and open fds. A trend like <span class="mono">+38 % in 2 min</span> under steady load means a leak.</div>' +
  '<div><b>Right side</b>Its sockets with RTT, a summary of open files, and the journal of its unit. ' + k('v') + ' switches to the environment.</div></div>' +
  '<div class="note"><b>Secrets stay hidden:</b> values of variables whose names look like keys, tokens, passwords, cookies or database URLs are shown as ••••••.</div>' +
  keys([[k('Esc') + ' ' + k('q'), 'Close the inspector'], [k('v'), 'Journal ⇄ environment'], [k('f'), 'Full open-file list in the Files view'], [k('x'), 'Send a signal'], [k('r'), 'Refresh the details'], [k('y'), 'Copy the command line']]) +
  tryit(['Open the inspector on your shell (2, select it, Enter).', 'Press v to see its environment and check that a TOKEN or PASSWORD variable is hidden.', 'Leave it open for two minutes and watch the graphs fill.']),
  quiz: [
    { q: 'Memory shows "+38 % in 2 min" while traffic is flat. What does that suggest?', o: ['Normal caching', 'A memory leak', 'Swap is off', 'The graph is broken'], a: 1, why: 'Growth under steady load is the signature of a leak. A single number never shows that; the trend does.' },
    { q: 'How do you open the inspector for the owner of a socket?', o: ['Enter in Sockets', 'i in Sockets', 'I in Files', 'o'], a: 1, why: 'In Sockets, Enter opens the owner’s files; i opens the owner in the inspector.' },
    { q: 'The inspector shows "restart needed: libraries replaced: libssl.so.3". Why does this matter?', o: ['It does not, the file on disk is new', 'The process still uses the old, possibly vulnerable library until it restarts', 'It means a crash is imminent', 'It is a display bug'], a: 1, why: 'A patched library on disk does nothing for a process that already loaded the old one.' }
  ] });

lesson({ id: 'network', group: 'Networking', title: 'Network & interfaces', min: 7,
  goals: ['Read link state, speed, utilisation, drops and errors', 'Use the TCP/UDP health panel', 'Find top talkers and peers'],
  body:
  '<div class="prose"><p>View <kbd>3</kbd> lists every interface with state, kind (vlan, bridge, bond, veth…), link speed and duplex, MTU, rates, <b>UTIL</b> (busiest direction against link speed), drops and errors. Select one with ↑↓ for its traffic graph.</p></div>' +
  '<div class="callout"><div><b>UTIL near 100 %</b>The link is saturated; a flat ceiling in the graph confirms it.</div>' +
  '<div><b>ERR &gt; 0</b>Layer 1/2: cable, optics, duplex mismatch, driver. Check <code>ethtool -S</code>.</div>' +
  '<div><b>DROPS</b>Ring buffers or softirq CPU can’t keep up.</div>' +
  '<div><b>MTU ≠ 1500</b>Highlighted: jumbo frames, tunnels or VPNs. A mismatch breaks large packets only.</div></div>' +
  '<h2>TCP / UDP health panel</h2><div class="prose"><p>Kernel counters (Linux): retransmit percentage, listen overflows, UDP buffer drops, timeouts, SYN retransmits, resets, opens per second, established connections, conntrack usage, ephemeral port usage and system file handles. Below it: <b>top talkers</b> (bandwidth per process) and <b>top peers</b> (remote hosts with the most connections).</p></div>' +
  tryit(['Press 3 and find your main interface. What is its MTU?', 'Watch the retransmits line while you download something large.']),
  quiz: [
    { q: 'An interface shows rx errors climbing. Where is the problem most likely?', o: ['In the application', 'Layer 1/2: cable, optics, duplex or driver', 'DNS', 'The firewall'], a: 1, why: 'Interface errors are physical or link-layer. The application cannot fix them.' },
    { q: 'What does UTIL measure?', o: ['CPU used by the NIC driver', 'The busiest direction as a share of the negotiated link speed', 'Packets per second', 'Buffer usage'], a: 1, why: 'UTIL = max(rx, tx) against link speed; at ~100 % the link is full.' },
    { q: 'Where do you see bandwidth per process?', o: ['Top talkers in Network, or NET/s in Procs', 'Only in Firewall', 'Only with tcpdump', 'Storage'], a: 0, why: 'vigil computes it from per-connection TCP byte counters (Linux).' }
  ] });

lesson({ id: 'sockets', group: 'Networking', title: 'Sockets in depth', min: 10,
  goals: ['Read RTT, retransmits, queues and bandwidth per connection', 'Use sorts and listening-only mode', 'Capture or close one connection'],
  body: term('sockets') +
  '<div class="callout"><div><b>RTT ms</b>Round-trip time of this connection; yellow from 30 ms, red from 100 ms.</div>' +
  '<div><b>RETR</b>Segments retransmitted on this connection. Growing = loss on its path.</div>' +
  '<div><b>RECV/SEND Q</b>Bytes waiting. A full receive queue on a LISTEN socket = accept backlog overflow.</div>' +
  '<div><b>Colours</b>Green LISTEN, cyan ESTABLISHED, yellow TIME_WAIT/FIN_WAIT, orange CLOSE_WAIT, purple SYN states.</div></div>' +
  '<div class="prose"><p>Below the table, the selected connection gets a <code>tcp_info</code> line: RTT ± jitter, cwnd, MSS, PMTU, unacked, lost, delivery rate. Containers show up with a NAMESPACE label. Service names (<code>443 https</code>) come from <code>/etc/services</code>.</p></div>' +
  keys([[k('l'), 'Listening sockets only (exposure audit)'], [k('s'), 'Cycle sort: process → port → state → proto → remote → rtt → traffic'],
        [k('↵'), 'Open files of the owner'], [k('i'), 'Inspect the owner'], [k('P'), 'Everything on this port'],
        [k('C'), 'Capture this connection with tcpdump to a .pcap (needs root)'], [k('D'), 'Close just this connection (Linux, root)'],
        [k('x'), 'Signal the owner'], [k('N'), 'Show host names']]) +
  '<div class="note warn"><b>Exposure check:</b> <code>*:5432</code> means Postgres listens on every interface. <code>127.0.0.1:5432</code> is local only. Databases and caches on <code>*</code> are a common leak.</div>' +
  tryit(['Press 4 then l: which services listen on * ?', 'Press s until the title says "sort rtt" and look at the slowest connections.']),
  quiz: [
    { q: 'CLOSE_WAIT keeps growing for one process. What is it?', o: ['A network problem', 'A firewall drop', 'The app never closes sockets the peer already closed: an application bug', 'Normal TIME_WAIT'], a: 2, why: 'CLOSE_WAIT means the other side closed; the local app must call close().' },
    { q: 'How do you record one connection for Wireshark?', o: ['R', 'C in Sockets', 'E', 'D in Sockets'], a: 1, why: 'C runs tcpdump with a filter for that connection; D closes it.' },
    { q: 'A connection sits in SYN_SENT. What does that point to?', o: ['The service is slow', 'No SYN-ACK comes back: firewall DROP or routing', 'DNS', 'A full disk'], a: 1, why: 'A RST fails fast; a silent drop leaves the connection hanging in SYN_SENT.' }
  ] });

lesson({ id: 'lsof', group: 'Networking', title: 'lsof & open files', min: 7,
  goals: ['Use the : query language', 'Answer "who uses this port / file?" in seconds', 'Find deleted files that fill a disk'],
  body:
  '<div class="prose"><p>Press <kbd>:</kbd> anywhere, or start with <code>-q</code>. vigil turns what you type into an lsof command and shows the result in Files (5).</p></div>' +
  '<div class="tbl"><table><thead><tr><th>You type</th><th>Runs</th><th>Answers</th></tr></thead><tbody>' +
  [['1234', 'lsof -nP -p 1234', 'Everything a process has open'], [':8080', 'lsof -nP -i :8080', 'Who uses this port'], ['tcp:443 / udp:53', 'lsof -nP -i tcp:443', 'One protocol'],
   ['@10.0.0.5', 'lsof -nP -i @10.0.0.5', 'Connections with one host'], ['/var/log/syslog', 'lsof -nP /var/log/syslog', 'Who has this file open'],
   ['+L1', 'lsof -nP +L1', 'Deleted files still taking space'], ['-u www-data -i', 'lsof -nP -u www-data -i', 'Any raw lsof arguments']]
   .map(function (r) { return '<tr><td class="mono">' + r[0] + '</td><td class="mono">' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
  keys([[k('↵'), 'Who else has this file or port open'], [k('p'), 'All files of this row’s pid'], [k('r'), 'Run the query again'], [k('x'), 'Signal the process']]) +
  '<div class="note tip"><b>Disk full but <code>du</code> disagrees?</b> <code>:+L1</code> lists files that were deleted while a process still holds them. Their space only returns when the last fd closes; send that process HUP (to reopen logs) or restart it.</div>' +
  tryit(['Type <code>:</code> then <code>:22</code> and Enter: who listens on SSH?', 'Type <code>:</code> then <code>+L1</code>.']),
  quiz: [
    { q: 'Deploy fails with "address already in use" on 8080. What do you type?', o: [':8080', '8080', '/8080', 'tcp'], a: 0, why: 'A leading colon means a port: lsof -i :8080.' },
    { q: 'What does <code>+L1</code> find?', o: ['Files larger than 1 GB', 'Deleted files that are still open', 'Symlinks', 'Locked files'], a: 1, why: 'Files with a link count below 1: deleted but held open.' },
    { q: 'Anything starting with - or + is…', o: ['ignored', 'passed to lsof unchanged', 'treated as a pid', 'a filter'], a: 1, why: 'That gives you every lsof option from the prompt.' }
  ] });

lesson({ id: 'storage', group: 'Storage & paths', title: 'Storage', min: 6,
  goals: ['Read space and inodes', 'Read iostat-style device latency', 'Find the process hammering a disk'],
  body:
  '<div class="prose"><p>View <kbd>6</kbd> has four parts: filesystems (size, used, free, % and <b>INODES</b>), block devices (Linux), disk I/O per process, and temperature sensors.</p></div>' +
  '<div class="tbl"><table><thead><tr><th>Device column</th><th>Meaning</th><th>Worry when</th></tr></thead><tbody>' +
  '<tr><td class="mono">R/s W/s</td><td>Requests per second</td><td>Compare with what the disk can do</td></tr>' +
  '<tr><td class="mono">READ/s WRITE/s</td><td>Throughput</td><td>Near the device maximum</td></tr>' +
  '<tr><td class="mono">AWAIT ms</td><td>Average time per request, queue included</td><td>SSD &gt; 10 ms, HDD &gt; 50 ms, badge at 100 ms</td></tr>' +
  '<tr><td class="mono">UTIL</td><td>Share of time with I/O in flight</td><td>Close to 100 % on a single disk</td></tr>' +
  '<tr><td class="mono">QUEUE</td><td>Average requests in flight</td><td>Keeps growing</td></tr>' +
  '</tbody></table></div>' +
  '<div class="note">On APFS (macOS), btrfs and zfs inodes are allocated dynamically, so the INODES column shows 0 % or a dash. On ext4 and xfs you get real numbers.</div>' +
  tryit(['Press 6 and check INODES for your root filesystem.', 'Start a big copy and watch AWAIT and UTIL (Linux).']),
  quiz: [
    { q: 'The server is slow, CPU is low, and AWAIT is 180 ms. Where is the bottleneck?', o: ['CPU', 'The disk', 'Network', 'DNS'], a: 1, why: 'High await with low CPU means tasks wait on I/O. PSI io would confirm it.' },
    { q: 'Which table tells you who is writing to the disk?', o: ['Filesystems', 'Disk I/O by process', 'Sensors', 'Devices'], a: 1, why: 'Devices tell you the disk is busy; the per-process table tells you who.' }
  ] });

lesson({ id: 'paths', group: 'Storage & paths', title: 'Routes, probes & firewall', min: 9,
  goals: ['Check routes, neighbours and DNS', 'Use probes, certificate checks and path traces', 'Find the firewall rule that drops traffic'],
  body:
  '<h2>Routes (7)</h2><div class="prose"><p>Routing table, neighbours (ARP/NDP) with <b>FAILED</b> and <b>INCOMPLETE</b> entries first, default gateways, DNS servers, and the reachability of the automatic probes. A FAILED neighbour is a host that does not answer at layer 2: down, wrong VLAN, or an IP conflict.</p></div>' +
  '<h2>Probes (8)</h2><div class="prose"><p>Probes measure reachability and latency again and again. vigil adds your gateway and DNS servers automatically; press <kbd>a</kbd> to add your own:</p></div>' +
  '<div class="tbl"><table><thead><tr><th>Target</th><th>Measures</th></tr></thead><tbody>' +
  '<tr><td class="mono">1.1.1.1</td><td>ICMP echo (ping)</td></tr><tr><td class="mono">tcp:db.internal:5432</td><td>TCP connect time; works where ping is blocked</td></tr>' +
  '<tr><td class="mono">dns:github.com</td><td>Resolver lookup time</td></tr><tr><td class="mono">https://api.example.com/health</td><td>HTTP status, time to first byte, days until the certificate expires</td></tr>' +
  '</tbody></table></div>' +
  '<div class="prose"><p>Columns: LAST, MIN, AVG, MAX, JITTER, LOSS, STATUS, CERT and a history sparkline. Select a probe and press <kbd>t</kbd> to trace the path hop by hop (mtr if installed, else traceroute). Loss that starts at one hop and continues to the end is real; loss at a single middle hop is usually ICMP rate limiting.</p></div>' +
  '<h2>Firewall (9)</h2><div class="prose"><p>nftables, iptables or pf rules with packets, bytes and live packets per second. <kbd>z</kbd> hides rules without hits, <kbd>s</kbd> sorts by packets per second, <kbd>/</kbd> filters. Needs root.</p></div>' +
  tryit(['Press 8, a, and add <code>https://github.com</code>. Read STATUS and CERT.', 'Select it and press t to trace the path.', 'sudo vigil, press 9, then z and s.']),
  quiz: [
    { q: 'Gateway has 0 % loss, 1.1.1.1 has 12 %. Where is the problem?', o: ['Your Wi-Fi or cable', 'Beyond your gateway: provider or upstream', 'DNS', 'Your firewall'], a: 1, why: 'If the first hop is clean, the loss happens further out. The trace (t) shows where it starts.' },
    { q: 'Ping is blocked by a firewall. How do you still measure a database host?', o: ['dns:host', 'tcp:host:5432', 'https://host', 'You cannot'], a: 1, why: 'A TCP connect probe measures reachability; even a refused connection proves the host answers.' },
    { q: 'Which badge warns about a certificate expiring?', o: ['TLS', 'CERT', 'HTTP', 'LOSS'], a: 1, why: 'CERT appears when an https probe’s certificate has fewer days left than cert_days (21 by default).' }
  ] });

lesson({ id: 'system', group: 'Services & people', title: 'Containers, System & Users', min: 9,
  goals: ['Spot CPU throttling and OOM kills per container', 'Find failed services and read their journal', 'See kernel events and who is logged in'],
  body:
  '<h2>Containers (0)</h2><div class="prose"><p>Docker, containerd/Kubernetes, CRI-O and Podman, read from cgroup v2 without any daemon. Columns: CPU%, LIMIT, <b>THROTTLED</b>, MEM, MEM%, OOM, IO and network rates, PIDS.</p><p><b>THROTTLED</b> is the share of scheduler periods in which the container hit its CPU quota. Its threads then wait even if the host has idle CPU, which looks like random latency.</p></div>' +
  '<h2>System (S)</h2><div class="prose"><p>systemd units with failed and restarting ones on top, the journal of the selected unit on the right, and kernel events at the bottom: OOM kills, link flaps, NIC resets, segfaults, I/O and filesystem errors, SYN floods, hung tasks. <kbd>e</kbd> moves the cursor between units and events; <kbd>↵</kbd> reloads the journal.</p></div>' +
  '<h2>Users (U)</h2><div class="prose"><p>Logged-in sessions (user, terminal, source address, idle time, what they run), failed SSH logins in the last hour per source address with the usernames tried, and accepted logins. Many attempts from one address with users like root, admin and test is a password-guessing bot.</p></div>' +
  '<div class="note">Containers, kernel events and SSH history are Linux features. Kernel events need root on most distributions.</div>' +
  tryit(['On a Linux server: sudo vigil, press 0, then S, then U.', 'In System, select a unit and read its journal; press e to jump to kernel events.']),
  quiz: [
    { q: 'A pod is slow while the node has idle CPU. Which column tells you why?', o: ['MEM%', 'THROTTLED', 'PIDS', 'OOM'], a: 1, why: 'CFS throttling pauses the container until the next period even with spare host CPU.' },
    { q: 'A process vanished. Where do you confirm it was OOM-killed?', o: ['Firewall', 'System → kernel events (or OOM in Containers)', 'Routes', 'Files'], a: 1, why: 'The OOM killer only logs to the kernel ring buffer, which vigil reads from /dev/kmsg.' },
    { q: 'Which key switches between units and kernel events in System?', o: ['Tab', 'e', 'k', 'S'], a: 1, why: 'Tab changes views; e changes the pane inside System.' }
  ] });

lesson({ id: 'reports', group: 'Services & people', title: 'Reports, diffs & config', min: 8,
  goals: ['Write Markdown and JSON reports', 'Compare before and after a change', 'Tune vigil with the config file and flags'],
  body:
  '<div class="prose"><p><code>vigil report</code> samples for a second and prints a report: status banner, summary table, findings each with a recommended action, then processes, network, storage, limits, containers, services, kernel events and system details. Inside the TUI, <kbd>R</kbd> writes the same report to a file.</p></div>' +
  '<div class="tbl"><table><thead><tr><th>Command</th><th>For</th></tr></thead><tbody>' +
  [['sudo vigil report &gt; incident.md', 'An incident ticket'], ['vigil report -f json -o snap.json', 'Scripts and dashboards'], ['vigil report --fail-on-alert', 'Exit code 2 when a threshold is crossed (cron, CI)'],
   ['vigil report -f json -o before.json', 'Snapshot before a change'], ['vigil report --diff before.json', 'What changed: findings, ports, services, containers, metrics, kernel events'], ['vigil report --top 25 --sample-ms 3000', 'Longer tables, longer sampling window']]
   .map(function (r) { return '<tr><td class="mono">' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
  '<h2>Config and flags</h2><div class="prose"><p>Settings live in <code>~/.config/vigil/config.toml</code> (Windows: <code>%APPDATA%\\vigil\\config.toml</code>; under sudo vigil uses the config of the user who ran sudo). Theme, interval, sort, tree mode, probes and reverse DNS are saved when you quit. vigil detects the OS at start and lays a <code>[linux]</code>, <code>[macos]</code> or <code>[windows]</code> section over the shared settings; <code>[keys]</code> remaps keys and <code>[[custom_themes]]</code> adds your own palettes. Flags win over the file:</p></div>' +
  '<div class="tbl"><table><thead><tr><th>Flag</th><th>Does</th></tr></thead><tbody>' +
  [['-t sockets', 'Start in a view'], ['-q :443', 'Run an lsof query at start'], ['-i 500', 'Interval in ms'], ['--theme nord', 'Pick a theme (auto picks ansi on terminals without truecolor)'], ['--list-themes', 'List themes'], ['--config path', 'Use another config file'], ['--no-save', 'Don’t write settings on quit'], ['--lsof-sockets', 'Use lsof instead of /proc/net on Linux'], ['--no-mouse', 'Disable the mouse']]
   .map(function (r) { return '<tr><td class="mono">' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
  tryit(['Run <code>vigil report -f json -o before.json</code>, start something (a web server, a container), then <code>vigil report --diff before.json</code>.']),
  quiz: [
    { q: 'You want cron to alert only when something is wrong. Which flag?', o: ['--quiet', '--fail-on-alert', '--diff', '--top 0'], a: 1, why: 'It exits with code 2 when a threshold is crossed, so <code>|| mail …</code> only fires then.' },
    { q: 'Which flag shows what changed since an earlier JSON report?', o: ['--compare', '--diff before.json', '--since', '-q'], a: 1, why: 'The diff lists new and resolved findings, ports, services, containers, metric shifts and new kernel events.' },
    { q: 'Under sudo, which config does vigil use?', o: ['/root/.config/vigil', 'The config of the user who ran sudo', '/etc/vigil.toml', 'None'], a: 1, why: 'So vigil and sudo vigil share one set of settings.' }
  ] });

lesson({ id: 'troubleshoot', group: 'Troubleshooting', title: 'Troubleshooting layer by layer', min: 12,
  goals: ['Run the doctor and read its verdict', 'Map each check to an OSI layer and its usual causes', 'Use the subnet, DNS, MTU and throughput tools', 'Ask vigil what something means with h'],
  body:
  '<div class="prose"><p>When something is <i>broken</i> rather than slow, press <kbd>W</kbd> for the Troubleshoot view, or run the same tools from the shell. Nothing is contacted until you run a tool; the targets live in <code>[troubleshoot]</code> in the config.</p>' +
  '<p>The <b>doctor</b> (<kbd>d</kbd>, or <code>vigil doctor</code>) checks every layer bottom-up and names the <b>lowest</b> one that fails, because a broken lower layer explains every failure above it. That is the method network courses teach: cable, then ARP, then IP, then TCP, then the application.</p></div>' +
  '<div class="tbl"><table><thead><tr><th>Layer</th><th>vigil checks</th><th>Usual cause when it fails</th></tr></thead><tbody>' +
  [['L1 Physical', 'carrier, speed, duplex, CRC / frame / collisions, link flaps', 'cable or optic, duplex mismatch, flapping port'],
   ['L2 Data link', 'gateway in the ARP table, LLDP neighbour', 'wrong VLAN, port down, port security / DAI'],
   ['L3 Network', 'usable IPv4, default route, gateway + internet loss, path MTU, IPv6', '169.254 = DHCP failed, missing route, tunnel MTU'],
   ['L4 Transport', 'TCP connect to the internet target, retransmits, listen drops', 'firewall or proxy-only network, congestion'],
   ['L5/6 Session, TLS', 'clock skew vs the web server, TLS handshake, certificate', 'no NTP, TLS-inspecting proxy'],
   ['L7 Application', 'system resolver, every DNS server directly, HTTP', 'dead resolver, split-horizon DNS, server errors']]
   .map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
  '<h2>The other tools</h2><div class="tbl"><table><thead><tr><th>Key / command</th><th>Use it for</th></tr></thead><tbody>' +
  [['c · vigil calc 10.0.0.0/22 /24', 'Mask, wildcard (ACL / OSPF), broadcast, host range, binary, splitting, membership: <code>vigil calc 10.0.0.0/22 10.0.4.1</code>'],
   ['n · vigil dns github.com MX', 'Ask every resolver directly; spot a dead one, NXDOMAIN on one only (split-horizon), SERVFAIL (DNSSEC)'],
   ['m · vigil mtu 1.1.1.1', 'Path MTU with DF pings: 1492 PPPoE, 1476 GRE, 1450 VXLAN, 1420 WireGuard; black holes'],
   ['p · vigil perf HOST', 'Throughput to <code>vigil perf --server</code> on the other side; <code>-P 4</code> streams, <code>-R</code> reverse'],
   ['h (any view)', 'Explain the selected item: CLOSE_WAIT, STALE, D state, OOM, DROP, a doctor check…'],
   ['F (any view)', 'Find a process, port, IP, MAC, service, container, route or user and jump to it']]
   .map(function (r) { return '<tr><td class="mono">' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
  '<h2>Switch CLI and vigil side by side</h2><div class="tbl"><table><thead><tr><th>Question</th><th>Junos</th><th>vigil</th></tr></thead><tbody>' +
  [['Link errors?', 'show interfaces ge-0/0/1 extensive', 'W link layer: CRC, frame, flaps'], ['Which port am I on?', 'show lldp neighbors', 'W LLDP neighbours'],
   ['Who has this MAC?', 'show ethernet-switching table', '7 neighbours, F search the MAC'], ['Which route?', 'show route 1.1.1.1', '7 routes, h on the route'],
   ['MTU on the path?', 'ping 1.1.1.1 size 1472 do-not-fragment', 'vigil mtu 1.1.1.1'], ['Which rule drops it?', 'show security policies hit-count', '9 firewall, z then s']]
   .map(function (r) { return '<tr><td>' + r[0] + '</td><td class="mono">' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
  '<div class="prose"><p><b>Windows</b>: vigil runs on Windows 10/11 natively (sockets from the IP Helper API, services, the System event log, <code>tracert</code>). The same doctor and tools work there. Windows 7/8.1 get an experimental build.</p></div>' +
  tryit(['Run <code>vigil doctor</code> and read the last line: it tells you where to start.', 'Run <code>vigil calc 192.168.10.77/26</code>: which host range and broadcast? Then <code>vigil calc 192.168.10.0/24 /26</code>.', 'In the Sockets view select a CLOSE_WAIT or TIME_WAIT row and press <kbd>h</kbd>.']),
  quiz: [
    { q: 'The doctor shows L1 and L2 fine, the gateway ping fails and DNS fails. Where do you start?', o: ['DNS', 'L3: the gateway', 'TLS', 'HTTP'], a: 1, why: 'DNS needs IP connectivity; the lowest failing layer is L3.' },
    { q: 'Your address is 169.254.12.7. What happened?', o: ['Static IP conflict', 'DHCP never answered (APIPA)', 'IPv6 only', 'VPN is up'], a: 1, why: '169.254/16 is self-assigned when no DHCP server answers.' },
    { q: 'Ping works, but TLS and SSH hang right after connecting. Which tool?', o: ['vigil calc', 'vigil mtu', 'vigil dns', 'vigil perf'], a: 1, why: 'Small packets pass and big ones vanish: a PMTU black hole.' },
    { q: 'One resolver answers NXDOMAIN and the others an internal IP. What is it?', o: ['A DNS attack', 'Split-horizon DNS: an internal zone the public resolver does not know', 'A broken cable', 'Clock skew'], a: 1, why: 'Internal names only exist on internal resolvers.' },
    { q: 'What is the wildcard mask of a /22?', o: ['255.255.252.0', '0.0.3.255', '0.0.0.255', '255.255.255.252'], a: 1, why: 'The wildcard is the inverted netmask: 255.255.252.0 → 0.0.3.255.' }
  ] });

// ───────────────────────────── trainer, drills, exam, cheat sheet ─────────────────────────────
var TRAIN = [

var DRILLS = [
  { title: 'Port already in use', story: 'Your deploy fails: "bind: address already in use" on port 8080.',
    steps: [
      { q: 'First move?', o: [':8080 then Enter', '4 then l', '2 then c', 'S'], a: 0, why: ':8080 asks lsof who holds the port.' },
      { q: 'It is an old instance of your app. What do you send first?', o: ['KILL', 'TERM', 'HUP', 'STOP'], a: 1, why: 'TERM lets it shut down cleanly; KILL only if it ignores TERM.' } ] },
  { title: 'Disk full, du disagrees', story: '/var is at 100 % but du finds 30 GB less.',
    steps: [
      { q: 'First check?', o: ['INODES column in Storage', ':+L1', '2 then m', 'Firewall'], a: 1, why: 'Space used by deleted-but-open files is invisible to du.' },
      { q: 'A rotated log is held by rsyslog. Fix?', o: ['Delete it again', 'Send HUP so it reopens its logs', 'Reboot', 'Close the socket with D'], a: 1, why: 'HUP makes it close the old file; the space returns.' } ] },
  { title: 'Slow API, idle CPU', story: 'p99 latency doubled. Host CPU is 30 %.',
    steps: [
      { q: 'The API runs in a container. Where first?', o: ['0 Containers, THROTTLED column', '6 Storage', '9 Firewall', 'U Users'], a: 0, why: 'Throttling causes latency with idle host CPU.' },
      { q: 'THROTTLED is 0 %. Next?', o: ['Storage devices AWAIT', 'Theme picker', 'Users', 'Routes'], a: 0, why: 'Low CPU plus slow responses often means waiting on disk.' } ] },
  { title: 'Clients time out, service looks idle', story: 'New connections time out; existing ones work. The LISTEN DROPS badge is on.',
    steps: [
      { q: 'Where do you confirm?', o: ['4 then l, RECV Q on the listener', '3 MTU', 'R', '7 Routes'], a: 0, why: 'A full receive queue on a LISTEN socket means the accept backlog is full.' },
      { q: 'Fix?', o: ['Restart the network', 'Raise the backlog and somaxconn, or add workers', 'Lower the MTU', 'Flush the firewall'], a: 1, why: 'The service accepts too slowly for the incoming rate.' } ] },
  { title: 'After apt upgrade', story: 'You patched OpenSSL. The NEEDS RESTART badge shows 4.',
    steps: [
      { q: 'How do you see which processes and units?', o: ['Enter on processes for the inspector', 'Firewall', ':+L1', 'Probes'], a: 0, why: 'The inspector shows "restart needed" and the unit that owns the process.' },
      { q: 'Then?', o: ['Nothing, the new library is on disk', 'systemctl restart the units', 'Reboot only on Fridays', 'Send STOP'], a: 1, why: 'Processes keep the old library until they restart.' } ] },
  { title: 'Who is hammering SSH?', story: 'The SSH FAILS badge shows 1400/h.',
    steps: [
      { q: 'Where?', o: ['U Users', '4 Sockets', '6 Storage', '0 Containers'], a: 0, why: 'Users groups failed logins by source with the usernames tried.' },
      { q: 'You want the attacker’s IP for fail2ban or the firewall.', o: ['Select it and press y', 'Press E', 'Press C', 'Press D'], a: 0, why: 'y copies the selected value to your clipboard.' } ] },
  { title: '“The internet is down”', story: 'A user on VLAN 20 has no internet. Others are fine.',
    steps: [
      { q: 'First move?', o: ['vigil doctor', 'Restart the router', 'vigil perf', 'T'], a: 0, why: 'The doctor walks L1 → L7 and names the lowest broken layer.' },
      { q: 'It says L2 Gateway MAC: ARP failed. Most likely?', o: ['DNS server down', 'The switch port is in the wrong VLAN', 'MTU too small', 'Expired certificate'], a: 1, why: 'No ARP reply from the gateway is a layer-2 problem: VLAN, port or port security.' } ] },
  { title: 'Websites half load over the VPN', story: 'Over the site-to-site VPN, small pages load, big downloads and TLS handshakes stall.',
    steps: [
      { q: 'Which tool?', o: ['vigil mtu REMOTE_IP', 'vigil calc', 'vigil dns', 'Users'], a: 0, why: 'Stalls on big packets point at the path MTU.' },
      { q: 'It reports a PMTU black hole at 1400. Fix?', o: ['Raise the MTU to 9000', 'Clamp the TCP MSS on the router (e.g. 1360) or allow ICMP frag-needed', 'Restart DNS', 'Disable IPv6'], a: 1, why: 'MSS clamping keeps TCP segments small enough for the tunnel.' } ] }
];

var EXAM = [
  { q: 'Which key opens the inspector from Procs?', o: ['i', '↵', 'f', 'v'], a: 1 },
  { q: 'Which view shows CPU throttling per container?', o: ['2 Procs', '0 Containers', 'S System', '3 Network'], a: 1 },
  { q: 'What does RETR in Sockets count?', o: ['Retries of DNS', 'Retransmitted segments on that connection', 'Reconnects', 'Read errors'], a: 1 },
  { q: 'What does <code>:@10.0.0.5</code> show?', o: ['Routes to that host', 'All connections with that host', 'Pings it', 'Firewall rules for it'], a: 1 },
  { q: 'A probe shows loss to 1.1.1.1 but not to the gateway. Next key?', o: ['t on that probe', 'D', 'z', 'E'], a: 0 },
  { q: 'What makes vigil hide an environment value?', o: ['Values longer than 40 characters', 'Names that look like keys, tokens, passwords, cookies or database URLs', 'Anything in uppercase', 'Nothing is hidden'], a: 1 },
  { q: 'Where are kernel OOM kills shown?', o: ['System → kernel events', 'Routes', 'Probes', 'Files'], a: 0 },
  { q: 'Which flag makes cron alert only when something is wrong?', o: ['--diff', '--fail-on-alert', '--no-save', '-q'], a: 1 },
  { q: 'Which key copies a selected IP to your clipboard?', o: ['c', 'y', 'C', 'E'], a: 1 },
  { q: 'CLOSE_WAIT piles up. Whose bug is it?', o: ['The network', 'The local application', 'The kernel', 'DNS'], a: 1 },
  { q: 'The INODES column is 100 %. What fails?', o: ['Reading files', 'Creating new files', 'Network', 'Nothing'], a: 1 },
  { q: 'Which key hides firewall rules without hits?', o: ['h', 'z', 's', '/'], a: 1 },
  { q: 'What does UTIL in Network measure?', o: ['Busiest direction against link speed', 'CPU of the driver', 'Packets per second', 'Errors'], a: 0 },
  { q: 'Which report command lists what changed since an earlier JSON report?', o: ['vigil report --diff before.json', 'vigil report --compare', 'vigil diff', 'vigil report -q'], a: 0 },
  { q: 'Lowercase t in Procs does what?', o: ['Theme picker', 'Process tree', 'Trace path', 'Top'], a: 1 },
  { q: 'Which key explains the selected item?', o: ['?', 'h', 'e', 'x'], a: 1 },
  { q: 'Which command checks the network layer by layer?', o: ['vigil report', 'vigil doctor', 'vigil calc', 'vigil mtu'], a: 1 },
  { q: 'How many usable hosts in a /26?', o: ['64', '62', '30', '126'], a: 1 }
];

var EXTRA = [
  { id: 'trainer', group: 'Practice', title: 'Key trainer', min: 5 },
  { id: 'drills', group: 'Practice', title: 'Incident drills', min: 10 },
  { id: 'exam', group: 'Practice', title: 'Final exam', min: 10 },
  { id: 'cheatsheet', group: 'Reference', title: 'Cheat sheet', min: 0 }
];

// ───────────────────────────── progress (per browser) ─────────────────────────────
var KEY = 'vigil-course-v1';
var state = { done: {}, quiz: {}, tries: {}, trainerBest: 0, drills: {}, examBest: null };
try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) state = Object.assign(state, saved); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} renderNav(); }

var ALL = L.concat(EXTRA);
function isDone(id) {
  if (id === 'trainer') return state.trainerBest >= 15;
  if (id === 'drills') return Object.keys(state.drills).length >= DRILLS.length;
  if (id === 'exam') return state.examBest !== null && state.examBest >= 12;
  if (id === 'cheatsheet') return false;
  return !!state.done[id];
}

function renderNav() {
  var nav = document.getElementById('nav');
  var cur = current();
  var html = '', last = '';
  ALL.forEach(function (x) {
    if (x.group !== last) { html += '<div class="group">' + x.group + '</div>'; last = x.group; }
    var d = isDone(x.id);
    html += '<a href="#' + x.id + '"' + (x.id === cur ? ' aria-current="page"' : '') + '><span class="dot' + (d ? ' done' : '') + '">' + (d ? '✓' : '') + '</span><span>' + x.title + '</span><span class="min">' + (x.min ? x.min + 'm' : '') + '</span></a>';
  });
  nav.innerHTML = html;
  var sel = document.getElementById('mobile-select');
  sel.innerHTML = ALL.map(function (x) { return '<option value="' + x.id + '"' + (x.id === cur ? ' selected' : '') + '>' + (isDone(x.id) ? '✓ ' : '') + x.title + '</option>'; }).join('');
  var countable = ALL.filter(function (x) { return x.id !== 'cheatsheet'; });
  var n = countable.filter(function (x) { return isDone(x.id); }).length;
  document.getElementById('progress-label').textContent = n + ' of ' + countable.length + ' done';
  document.getElementById('progress-bar').style.width = (n / countable.length * 100) + '%';
}
document.getElementById('mobile-select').addEventListener('change', function (e) { location.hash = e.target.value; });

function current() { var h = location.hash.replace('#', ''); return ALL.some(function (x) { return x.id === h; }) ? h : 'welcome'; }

function quizHTML(qs, prefix) {
  return '<div class="quiz">' + qs.map(function (q, i) {
    return '<div class="q" data-q="' + prefix + i + '"><div><b>' + (i + 1) + '.</b> ' + q.q + '</div><div class="opts">' +
      q.o.map(function (o, j) { return '<button class="opt" data-i="' + j + '">' + o + '</button>'; }).join('') +
      '</div><div class="why" hidden></div></div>';
  }).join('') + '</div>';
}
function wireQuiz(root, qs, onAnswered) {
  root.querySelectorAll('.q').forEach(function (el, i) {
    el.querySelectorAll('button.opt').forEach(function (b) {
      b.addEventListener('click', function () {
        var pick = +b.dataset.i, q = qs[i];
        el.querySelectorAll('button.opt').forEach(function (x) { x.disabled = true; });
        el.querySelector('[data-i="' + q.a + '"]').classList.add('right');
        if (pick !== q.a) b.classList.add('wrong');
        var why = el.querySelector('.why');
        if (q.why) { why.innerHTML = (pick === q.a ? '✓ Right. ' : '✗ Not quite. ') + q.why; why.hidden = false; }
        onAnswered(i, pick === q.a);
      });
    });
  });
}

function pager(id) {
  var i = ALL.findIndex(function (x) { return x.id === id; });
  var prev = ALL[i - 1], next = ALL[i + 1];
  return '<div class="pager">' + (prev ? '<a class="btn" href="#' + prev.id + '">← ' + prev.title + '</a>' : '<span></span>') +
    (next ? '<a class="btn primary" href="#' + next.id + '">' + next.title + ' →</a>' : '') + '</div>';
}

// ───────────────────────────── views ─────────────────────────────
function showLesson(l) {
  var main = document.getElementById('main');
  var idx = L.indexOf(l) + 1;
  main.innerHTML =
    '<span class="eyebrow">Lesson ' + idx + ' of ' + L.length + ' · ' + l.group + ' · ' + l.min + ' min</span><h1>' + l.title + '</h1>' +
    '<div class="goals"><h3>You will learn</h3><ul>' + l.goals.map(function (g) { return '<li>' + g + '</li>'; }).join('') + '</ul></div>' +
    l.body + '<h2>Check yourself</h2>' + quizHTML(l.quiz, l.id) +
    '<p class="result" id="result" aria-live="polite"></p>' + pager(l.id);
  var answered = {}, right = 0;
  wireQuiz(main, l.quiz, function (i, ok) {
    answered[i] = true; if (ok) right++;
    if (Object.keys(answered).length === l.quiz.length) {
      state.quiz[l.id] = right; state.done[l.id] = true; save();
      document.getElementById('result').textContent = right === l.quiz.length ? 'All correct. Lesson complete ✓' : right + ' of ' + l.quiz.length + ' correct. Lesson marked complete; reread the explanations above.';
    }
  });
  var tries = state.tries[l.id] || {};
  main.querySelectorAll('input[data-try]').forEach(function (cb) {
    cb.checked = !!tries[cb.dataset.try];
    cb.addEventListener('change', function () { tries[cb.dataset.try] = cb.checked; state.tries[l.id] = tries; save(); });
  });
}

var trainer = null;
function norm(e) {
  var m = { Enter: '↵', Escape: 'Esc', ' ': 'space', ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Delete: 'Del', Backspace: 'Backspace', Tab: 'Tab' };
  return m[e.key] || e.key;
}
function showTrainer() {
  var main = document.getElementById('main');
  main.innerHTML = '<span class="eyebrow">Practice</span><h1>Key trainer</h1><p class="lead">vigil is fastest when your fingers know the keys. Press the key that does what the card says. 20 cards per round; 15 or more correct completes this step.</p>' +
    '<div class="trainer" id="tr" tabindex="0"><span class="ctx" id="tr-ctx">Ready</span><div class="task" id="tr-task">Press Start, then answer with your keyboard.</div><div class="fb" id="tr-fb" aria-live="polite"></div>' +
    '<div class="stats"><span><b id="tr-n">0/20</b>card</span><span><b id="tr-ok">0</b>correct</span><span><b id="tr-streak">0</b>streak</span><span><b>' + state.trainerBest + '</b>best</span></div>' +
    '<button id="tr-start">Start</button><span class="keys-hint">Enter = ↵ · Escape = Esc · shift+letter for capitals</span></div>' + pager('trainer');
  document.getElementById('tr-start').addEventListener('click', function () {
    var deck = TRAIN.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 20);
    trainer = { deck: deck, i: 0, ok: 0, streak: 0, wait: false };
    nextCard(); document.getElementById('tr').focus();
  });
}
function nextCard() {
  var t = trainer;
  if (t.i >= t.deck.length) {
    document.getElementById('tr-ctx').textContent = 'Round finished';
    document.getElementById('tr-task').textContent = t.ok + ' of 20 correct';
    document.getElementById('tr-fb').textContent = t.ok >= 15 ? 'Done ✓ Your fingers know vigil.' : 'Press Start for another round.';
    if (t.ok > state.trainerBest) { state.trainerBest = t.ok; save(); }
    trainer = null; return;
  }
  var c = t.deck[t.i];
  document.getElementById('tr-ctx').textContent = 'In ' + c[0];
  document.getElementById('tr-task').textContent = c[1];
  document.getElementById('tr-n').textContent = (t.i + 1) + '/20';
}
document.addEventListener('keydown', function (e) {
  if (!trainer || trainer.wait || current() !== 'trainer' || e.metaKey || e.ctrlKey || e.altKey) return;
  var key = norm(e);
  if (key === 'Shift' || key === 'CapsLock') return;
  e.preventDefault();
  var c = trainer.deck[trainer.i], ok = c[2].indexOf(key) >= 0, fb = document.getElementById('tr-fb');
  if (ok) { trainer.ok++; trainer.streak++; fb.innerHTML = '<span class="g">✓ ' + key + '</span>'; }
  else { trainer.streak = 0; fb.innerHTML = '<span class="r">✗ you pressed ' + key + '</span>, the answer is <span class="y">' + c[2].join(' or ') + '</span>'; }
  document.getElementById('tr-ok').textContent = trainer.ok;
  document.getElementById('tr-streak').textContent = trainer.streak;
  trainer.wait = true;
  setTimeout(function () { if (!trainer) return; trainer.wait = false; trainer.i++; nextCard(); }, ok ? 450 : 1400);
});

function showDrills() {
  var main = document.getElementById('main');
  main.innerHTML = '<span class="eyebrow">Practice</span><h1>Incident drills</h1><p class="lead">Real situations, step by step. Pick what you would do; every answer explains why.</p>' +
    DRILLS.map(function (d, i) {
      return '<h2>' + (state.drills[i] ? '✓ ' : '') + d.title + '</h2><p class="prose">' + d.story + '</p>' + quizHTML(d.steps, 'd' + i + '-').replace('<div class="quiz">', '<div class="quiz" data-drill="' + i + '">');
    }).join('') + pager('drills');
  main.querySelectorAll('[data-drill]').forEach(function (el) {
    var i = +el.dataset.drill, n = 0;
    wireQuiz(el, DRILLS[i].steps, function () { n++; if (n === DRILLS[i].steps.length) { state.drills[i] = true; save(); } });
  });
}

function showExam() {
  var main = document.getElementById('main');
  main.innerHTML = '<span class="eyebrow">Practice</span><h1>Final exam</h1><p class="lead">15 questions across the whole course. 12 or more correct (80 %) passes.' + (state.examBest !== null ? ' Your best so far: ' + state.examBest + '/15.' : '') + '</p>' +
    quizHTML(EXAM, 'x') + '<p class="result" id="exam-result" aria-live="polite"></p><div class="pager"><button class="btn" id="exam-retry">Start over</button></div>' + pager('exam');
  var n = 0, right = 0;
  wireQuiz(main, EXAM, function (i, ok) {
    n++; if (ok) right++;
    if (n === EXAM.length) {
      if (state.examBest === null || right > state.examBest) { state.examBest = right; save(); }
      document.getElementById('exam-result').textContent = right >= 12 ? 'Passed with ' + right + '/15 ✓ You know vigil.' : right + '/15. Review the lessons you missed and try again.';
    }
  });
  document.getElementById('exam-retry').addEventListener('click', showExam);
}

  document.getElementById('main').innerHTML = '<span class="eyebrow">Reference</span><h1>Cheat sheet</h1><p class="lead">Every key in vigil v0.5 on one page.</p><div class="cheat">' +

    g('Inspector', [[k('Esc'), 'close'], [k('v'), 'journal ⇄ env'], [k('f'), 'all files'], [k('x'), 'signal'], [k('r'), 'refresh'], [k('y'), 'copy command']]) +
    g('Sockets', [[k('l'), 'listening only'], [k('s'), 'sort … rtt traffic'], [k('↵'), 'owner’s files'], [k('i'), 'inspect owner'], [k('P'), 'everything on port'], [k('C'), 'capture'], [k('D'), 'close connection'], [k('x'), 'signal owner']]) +
    g('Files', [[k('↵'), 'who else has it'], [k('p'), 'files of this pid'], [k('r'), 'rerun'], [k('x'), 'signal']]) +
    g('Probes · Firewall · System', [[k('a') + ' ' + k('d'), 'add / delete probe'], [k('t'), 'trace path'], [k('z'), 'firewall: hits only'], [k('s'), 'firewall: sort by pkt/s'], [k('e'), 'system: units ⇄ events'], [k('↵'), 'system: reload journal']]) +
    g('Signal dialog', [[k('↑') + k('↓'), 'choose'], [k('1') + '–' + k('9'), 'pick directly'], [k('↵'), 'send'], [k('Esc'), 'cancel']]) +
    g('Theme picker', [[k('↑') + k('↓'), 'preview'], [k('↵'), 'keep'], [k('Esc'), 'cancel'], [k('b'), 'background on/off']]) +
    g('lsof queries (:)', [['<code>1234</code>', 'process'], ['<code>:8080</code>', 'port'], ['<code>tcp:443</code>', 'protocol'], ['<code>@10.0.0.5</code>', 'host'], ['<code>/path</code>', 'who has it open'], ['<code>+L1</code>', 'deleted but open'], ['<code>-u user</code>', 'raw arguments']]) +
    g('Command line', [['<code>-t view</code>', 'start view'], ['<code>-q :443</code>', 'query at start'], ['<code>-i 500</code>', 'interval'], ['<code>--theme x</code>', 'theme'], ['<code>report</code>', 'Markdown report'], ['<code>-f json</code>', 'JSON'], ['<code>--fail-on-alert</code>', 'exit 2 on alerts'], ['<code>--diff f.json</code>', 'what changed']]) +
    '</div>' + pager('cheatsheet');
}

function route() {
  var id = current();
  trainer = null;
  var l = L.find(function (x) { return x.id === id; });
  if (l) showLesson(l);
  else if (id === 'trainer') showTrainer();
  else if (id === 'drills') showDrills();
  else if (id === 'exam') showExam();
  else showCheat();
  renderNav();
  window.scrollTo(0, 0);
  var m = document.getElementById('main'); if (m) m.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
route();
})();
</script>
